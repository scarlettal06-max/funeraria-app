{% extends 'base.html' %}{% block content %}<h1>{{title}}</h1><form method="post" class="form"><label>Nombre<input name="name" value="{{service.name if service else ''}}" required></label><label>Descripción<textarea name="description" rows="5" required>{{service.description if service else ''}}</textarea></label><label>Precio<input name="price" value="{{service.price if service else ''}}" required></label><button class="btn">Guardar</button> <a href="/admin/servicios">Cancelar</a></form>{% endblock %}
